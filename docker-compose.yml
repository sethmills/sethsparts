services:
  sethsparts:
    build: .
    container_name: sethsparts
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/London
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set in .env}
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - DJANGO_MEDIA_ROOT=/app/data/media
      # Optional -- only needed for the Home Assistant voice-search API (/api/locate/).
      # Leave unset in .env and the endpoint just rejects every request.
      - VOICE_SEARCH_API_KEY=${VOICE_SEARCH_API_KEY:-}
      # Optional -- only needed once the LED "find the part" Pi controller exists (Phase 8).
      # Leave unset in .env and the Locate button just reports "not configured".
      - LED_CONTROLLER_URL=${LED_CONTROLLER_URL:-}
      - LED_CONTROLLER_KEY=${LED_CONTROLLER_KEY:-}
      # Optional -- only needed once the Zebra label printer's Pi print-bridge exists.
      # Leave unset in .env and the Print button just reports "not configured".
      - LABEL_PRINTER_URL=${LABEL_PRINTER_URL:-}
      - LABEL_PRINTER_KEY=${LABEL_PRINTER_KEY:-}
      # Optional -- only needed for the Pi kiosk's own auto-login (never Seth's real
      # password). Leave unset in .env and that endpoint just no-ops.
      - KIOSK_AUTOLOGIN_TOKEN=${KIOSK_AUTOLOGIN_TOKEN:-}
      - KIOSK_AUTOLOGIN_USERNAME=${KIOSK_AUTOLOGIN_USERNAME:-seth}
      # Optional -- powers the opt-in "Suggest enrichment" button (DeepSeek).
      # Leave unset in .env and the button just stays hidden.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Optional -- the DeepSeek model to use. Defaults to deepseek-chat in settings.py.
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}

  # Cloudflare Tunnel -- optional, and OFF unless you ask for it.
  #
  # It sits behind a profile because most installs never need it: the app works fine on
  # your own network, and this is only for reaching it from a phone or another workshop.
  # The profile is also what lets the app start without a tunnel token, which is what
  # makes the copy-paste install in README.md work.
  #
  #   docker compose up -d                     # just the app, on 127.0.0.1:3200
  #   docker compose --profile tunnel up -d    # app + tunnel (needs TUNNEL_TOKEN in .env)
  #
  # Pass the same --profile flag to `down`, or it takes the tunnel with it and a later
  # plain `up -d` will not bring it back.
  #
  # Setup: Zero Trust -> Networks -> Tunnels -> Create a tunnel (Docker connector), point
  # its public hostname at http://sethsparts:3200, and copy the token into TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sethsparts-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Blank rather than required: turning the profile on without a token should fail in
      # cloudflared's own logs, which say so, rather than stopping the app from booting.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - sethsparts
