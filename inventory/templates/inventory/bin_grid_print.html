<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bin labels — {{ drawer.label }}</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #fff; color: #000; }
  .header { padding: 12px 16px; }
  .header h1 { font-size: 1rem; margin: 0; }
  .header .muted { color: #666; font-size: 0.85rem; }
  .sheet { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 10px 16px; box-sizing: border-box; }
  .cell { border: 1px dashed #bbb; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; min-height: 20vh; }
  .cell img { max-width: 100%; height: 64px; }
  .cell .num { font-weight: 700; margin-top: 6px; font-size: 0.9rem; }
  .cell .code { color: #888; font-size: 0.65rem; margin-top: 2px; word-break: break-all; text-align: center; }
  @media print {
    .header { display: none; }
    .cell { border: 1px solid #ccc; page-break-inside: avoid; min-height: 22vh; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>{{ drawer.label }} — bin labels (4×4 grid)</h1>
    <span class="muted">Container #{{ drawer.container.number }} · stick them on in this exact layout, top row = bins 1-4.</span>
  </div>
  <div class="sheet">
    {% for row in rows %}
      {% for b in row %}
      <div class="cell">
        <img src="{% url 'inventory:barcode_svg' b.barcode_id %}" alt="{{ b.barcode_id }}">
        <span class="num">Bin {{ b.bin_number }}</span>
        <span class="code">{{ b.barcode_id }}</span>
      </div>
      {% endfor %}
    {% endfor %}
  </div>
</body>
</html>
